name: UBports Kernel Audit - sweet

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: "https://github.com/techyminati/android_kernel_xiaomi_sweet.git"
        required: true
        type: string
      kernel_branch:
        description: "Kernel branch"
        default: "android-11.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git file python3
      - name: Find candidate defconfig files
        shell: bash
        run: |
          set -euo pipefail

          REPORT="kernel-audit-report.md"
          echo "## Candidate defconfig files" >> "$REPORT"

          find kernel/arch -type f \
            \( -name '*defconfig' -o -name 'defconfig' \) \
            -print 2>/dev/null \
            | sort > /tmp/defconfig-list.txt || true

          if [ -s /tmp/defconfig-list.txt ]; then
            sed -n '1,100p' /tmp/defconfig-list.txt >> "$REPORT"
          else
            echo "Tidak ditemukan kandidat defconfig." >> "$REPORT"
          fi
      - name: Clone kernel source
        env:
          KERNEL_URL: ${{ inputs.kernel_url }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$KERNEL_URL" =~ ^https://github\.com/[^/]+/[^/]+(\.git)?$ ]] || {
            echo "Gunakan URL repository GitHub yang valid"
            exit 1
          }

          git clone --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_URL" kernel

      - name: Audit source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          REPORT="$GITHUB_WORKSPACE/audit/kernel-report.txt"

          {
            echo "Device target: sweet"
            echo "Target OS: UBports / Ubuntu Touch"
            echo "Catatan: belum ada klaim kompatibilitas."

            echo
            echo "=== Commit ==="
            git -C kernel log -1 --format='%H%n%s'

            echo
            echo "=== Kernel version ==="
            if [[ -f kernel/Makefile ]]; then
              grep -E \
                '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
                kernel/Makefile || true
            fi

            echo
            echo "=== Architecture config candidates ==="
            find kernel/arch/arm64/configs \
              -maxdepth 3 -type f \
              \( -name '*sweet*defconfig' \
              -o -name '*defconfig' \
              -o -name '*halium*.config' \) \
              -print 2>/dev/null | head -n 250 || true

            echo
            echo "=== Build scripts ==="
            find kernel -maxdepth 3 -type f \
            \( -name 'build.sh' \
            -o -name 'Makefile' \
            -o -name 'build.config*' \
            -o -name 'Kconfig' \) \
            -print | sed -n '1,200p'

            echo
            echo "=== Relevant kernel configuration ==="
            grep -R -n -E \
              'CONFIG_(DEVTMPFS|FHANDLE|SYSVIPC|IPC_NS|NET_NS|PID_NS|USER_NS|UTS_NS|SECURITY_APPARMOR)=' \
              kernel/arch/arm64/configs \
              2>/dev/null | head -n 200 || true

            echo
            echo "=== Existing boot and device metadata ==="
            find kernel -type f \
              \( -name 'deviceinfo' \
              -o -name 'BoardConfig.mk' \
              -o -name 'fstab*' \
              -o -name 'mkbootimg*' \) \
              -print | head -n 200
          } 2>&1 | tee "$REPORT"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-kernel-audit
          path: audit/kernel-report.txt
          if-no-files-found: warn
          retention-days: 7

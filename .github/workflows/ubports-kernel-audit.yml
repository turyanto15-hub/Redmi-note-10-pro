name: Audit Kernel sweet

on:
 workflow_dispatch:

permissions:
 contents: read
jobs:
  audit:
   runs-on: ubuntu-latest
   timeout-minutes: 10 
   
   steps:
   - name: Checkout repository
     uses: actions/checkout@v4

   - name: Check repository
     shell: bash
     run: |
      set -eu
      echo "=== Repository ==="
      pwd
      git log -1 --oneline

   - name: Locate kernel source
     shell: bash
     run: |
      set -eu

      if [ -f kernel/Makefile ]; then
        KERNEL_DIR=kernel
      elif [ -f Makefile ] && [ -d arch/arm64 ]; then
        KERNEL_DIR=.
      else
        echo "::error::Kernel source tidak ditemukan."
        echo "Source harus berada di folder kernel/ atau root repository."
        exit 1
      fi

      echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

   - name: Check kernel version
     shell: bash
     run: |
      set -eu
      echo "=== Kernel version ==="
      grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' "$KERNEL_DIR/Makefile"

   - name: Inspect sweet defconfig
     shell: bash
     run: |
      set -eu

      DEFCONFIG="$KERNEL_DIR/arch/arm64/configs/vendor/sweet_user_defconfig"

      echo "=== Defconfig ==="
      if [ -f "$DEFCONFIG" ]; then
        sed -n '1,100p' "$DEFCONFIG"
      else
        echo "::warning::Vendor sweet defconfig tidak ditemukan."
      fi

      echo "=== Build config ==="
      if [ -f "$KERNEL_DIR/build.config.aarch64" ]; then
        sed -n '1,100p' "$KERNEL_DIR/build.config.aarch64"
      else
        echo "build.config.aarch64 tidak ditemukan."
      fi

   - name: Inspect device tree
     shell: bash
     run: |
      set -eu

      DTS_DIR="$KERNEL_DIR/arch/arm64/boot/dts"

      if [ -d "$DTS_DIR" ]; then
        find "$DTS_DIR" -type f \
          | grep -Ei 'sweet|atoll|sm6150|qcom' \
          | sed -n '1,100p' || true
      else
        echo "Direktori device tree tidak ditemukan."
      fi

   - name: Inspect boot files
     shell: bash
     run: |
      set -eu

      find . -maxdepth 5 -type f \
        \( -name 'boot.img' \
        -o -name 'dtbo.img' \
        -o -name 'vendor_boot.img' \
        -o -name 'mkbootimg' \
        -o -name 'Image.gz' \
        -o -name 'Image.gz-dtb' \) \
        -print | sed -n '1,100p'

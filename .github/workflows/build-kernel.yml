name: Build KSUNext Kernel - Redmi Note 10 Pro (sweet)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "KSUNext kernel source branch"
        required: true
        default: "sixteen-ksu-next"
      device:
        description: "Device codename (this workflow is configured for sweet)"
        required: true
        default: "sweet"
        type: choice
        options:
          - sweet
      upload_debug_files:
        description: "Upload build output and logs for debugging"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

concurrency:
  group: kernel-sweet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel and AnyKernel3 ZIP
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DEVICE: ${{ inputs.device || 'sweet' }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch || 'sixteen-ksu-next' }}
      CLANG_DIR: /home/runner/evo16/prebuilts/clang/host/linux-x86/clang-r547379

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libelf-dev \
            python3 python-is-python3

      - name: Checkout KSUNext kernel source
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            https://github.com/Mryassinov/kernel_xiaomi_sweet.git kernel-source
          cd kernel-source
          git submodule update --init --recursive
          echo "Kernel branch: $(git branch --show-current)"
          echo "Kernel commit: $(git rev-parse HEAD)"
          echo "Kernel version from Makefile:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile || true

      - name: Install Clang toolchain expected by upstream build.sh
        run: |
          mkdir -p "$(dirname "$CLANG_DIR")"
          curl -fL --retry 3 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz \
            -o /tmp/clang-r547379.tar.gz
          mkdir -p "$CLANG_DIR"
          tar -xzf /tmp/clang-r547379.tar.gz -C "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"
          "$CLANG_DIR/bin/clang" --version

      - name: Verify device configuration
        run: |
          cd kernel-source
          test "$DEVICE" = "sweet"
          test -f "arch/arm64/configs/${DEVICE}_defconfig"
          echo "Found defconfig: arch/arm64/configs/${DEVICE}_defconfig"
          grep -E '^(CONFIG_ARM64|CONFIG_ARCH_QCOM|CONFIG_LOCALVERSION)=' \
            "arch/arm64/configs/${DEVICE}_defconfig" || true
          git submodule status

      - name: Build kernel and package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          cd kernel-source

          echo "=== Build kernel ==="
          printf '%s\n' "$DEVICE" | bash ./build.sh 2>&1 | tee ../kernel-build.log

          echo "=== Clone AnyKernel3 ==="
          cd ..
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          echo "=== Check build output ==="
          cd kernel-source

          IMAGE=""
          for candidate in \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz-dtb; do
            if [ -s "$candidate" ]; then
              IMAGE="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel image tidak ditemukan."
            find . -type f \( \
              -name Image -o \
              -name Image.gz -o \
              -name Image.gz-dtb \
            \) -print
            exit 1
          fi

          echo "Kernel image ditemukan: $IMAGE"

          echo "=== Prepare AnyKernel3 package ==="
          cp -f "$IMAGE" ../AnyKernel3/

          cd ../AnyKernel3

          if [ ! -f anykernel.sh ]; then
            echo "ERROR: anykernel.sh tidak ditemukan."
            exit 1
          fi

          zip -r9 "../KSUNext-${DEVICE}-AnyKernel3.zip" . \
            -x '.git/*' \
            -x '*.zip'

          unzip -t "../KSUNext-${DEVICE}-AnyKernel3.zip"

          mkdir -p ../artifacts
          mv "../KSUNext-${DEVICE}-AnyKernel3.zip" ../artifacts/

          {
            echo "Device: $DEVICE"
            echo "Source: https://github.com/Mryassinov/kernel_xiaomi_sweet"
            echo "Branch: $KERNEL_BRANCH"
            echo "Commit: $(git -C ../kernel-source rev-parse HEAD)"
            echo "Kernel image: $IMAGE"
            echo "Packaging: AnyKernel3"
          } > ../artifacts/BUILD-INFO.txt


      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KSUNext-sweet-AnyKernel3
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload image files and build information
        if: ${{ always() && inputs.upload_debug_files != false }}
        uses: actions/upload-artifact@v4
        with:
          name: KSUNext-sweet-debug
          path: |
            kernel-build.log
            artifacts/BUILD-INFO.txt
            artifacts/Image.gz
            artifacts/dtbo.img
            artifacts/dtb.img
          if-no-files-found: warn
          retention-days: 14

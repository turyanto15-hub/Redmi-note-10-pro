name: Build Android Kernel Rebase (Manual Way)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel via Cloud
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Compiling Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev u-boot-tools zip libffi-dev libncurses-dev git libelf-dev libkmod-dev

      - name: Download Proton Clang Toolchain
        run: |
          echo "Mengunduh Proton Clang Compiler..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git
      - name: Integrate KernelSU-Next 
        run: |
          echo "Mengunduh dan menyuntikkan KernelSU-Next..."
          curl -LSs --retry 5 --retry-delay 3 "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # DETEKSI OTOMATIS: Mencari di mana letak file sweet_defconfig berada
         working-directory: kernel-source
        run: |
          # DETEKSI OTOMATIS: Mencari di mana letak file sweet_defconfig berada
          CONF_PATH=$(find arch/arm64/configs/ -name "sweet_defconfig" | head -n 1)
          if [ -n "$CONF_PATH" ]; then
            echo "File defconfig ditemukan di: $CONF_PATH"
            
            # Memasukkan konfigurasi dasar KernelSU-Next
            echo "CONFIG_KSU=y" >> "$CONF_PATH"
            echo "CONFIG_KSU_NEXT=y" >> "$CONF_PATH"
            
            # REKOMENDASI TAMBAHAN UNTUK 4.14 (NON-GKI): Mengaktifkan Kprobe Hooks
            echo "CONFIG_KPROBES=y" >> "$CONF_PATH"
            echo "CONFIG_HAVE_KPROBES=y" >> "$CONF_PATH"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$CONF_PATH"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$CONF_PATH"
            
            echo "Konfigurasi KernelSU-Next berhasil disuntikkan ke defconfig!"
          else
            echo "PERINGATAN: File sweet_defconfig tidak ditemukan di folder configs!"
            exit 1
          fi
      - name: Hardcode Patch to Hide Bootloader Unlock (UBL)
        run: |
          echo "Memulai injeksi bypass UBL..."
          find . -type f -name "*.c" -o -name "*.h" -o -name "*.sh" | xargs sed -i 's/androidboot.verifiedbootstate=orange/androidboot.verifiedbootstate=green/g' 2>/dev/null || true
          find . -type f -name "*.c" -o -name "*.h" -o -name "*.sh" | xargs sed -i 's/androidboot.flash.locked=0/androidboot.flash.locked=1/g' 2>/dev/null || true
          find . -type f -name "init_context.c" -o -name "init.c" | xargs sed -i 's/boot_state = "orange"/boot_state = "green"/g' 2>/dev/null || true
          find drivers/of/ -type f -name "*.c" | xargs sed -i 's/"orange"/"green"/g' 2>/dev/null || true

      - name: Compile Kernel Manually
        run: |
          echo "Memulai proses kompilasi kernel dengan Proton Clang..."
          export PATH="${PWD}/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # DETEKSI JALUR DEFCONFIG KEDUA UNTUK PROSES MAKE
          CONF_FILE=$(find arch/arm64/configs/ -name "sweet_defconfig" | sed 's|arch/arm64/configs/||')
          echo "Menggunakan konfigurasi: $CONF_FILE"
          
          make O=out "$CONF_FILE"
          
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3 (HyperOS Optimized)
        run: |
          echo "Membuat paket ZIP Flashable..."
          git clone --depth=1 https://github.com AnyKernel3
          
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
          
          echo "is_slot_device=0;" >> anykernel.sh
          echo "ramdisk_compression=auto;" >> anykernel.sh
          echo "split_boot=auto;" >> anykernel.sh
          
          zip -r9 ../Kernel-HyperOS-Sweet-KSUNext.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-HyperOS-Sweet-KSUNext
          path: Kernel-HyperOS-Sweet-KSUNext.zip

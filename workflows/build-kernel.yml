name: Build Android Kernel Rebase (HyperOS + KSU-Next + Hide UBL Android 17)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel A17 via Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Wajib menggunakan Java 17 untuk sistem build Android modern

      # =========================================================================
      # SUNTIK KERNELSU-NEXT SECARA MANUAL KE SOURCE KERNEL
      # =========================================================================
      - name: Integrate KernelSU-Next
        run: |
          echo "Mengunduh dan menerapkan KernelSU-Next..."
          curl -LSs "https://githubusercontent.com" | bash -s main
          
          # Memasukkan flag build KSU-Next langsung ke konfigurasi defconfig perangkat
          echo "CONFIG_KSU=y" >> arch/arm64/configs/sweet_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/sweet_defconfig

      # =========================================================================
      # BYPASS LOCK STATUS (MENYEMBUNYIKAN UBL DI TINGKAT KERNEL ANDROID 17)
      # =========================================================================
      - name: Hardcode Patch to Hide Bootloader Unlock (UBL)
        run: |
          echo "Memulai injeksi bypass UBL tingkat lanjut..."
          
          # 1. Bypass baris perintah string boot state lama
          find . -type f -name "*.c" -o -name "*.h" -o -name "*.sh" | xargs sed -i 's/androidboot.verifiedbootstate=orange/androidboot.verifiedbootstate=green/g' 2>/dev/null || true
          find . -type f -name "*.c" -o -name "*.h" -o -name "*.sh" | xargs sed -i 's/androidboot.flash.locked=0/androidboot.flash.locked=1/g' 2>/dev/null || true
          
          # 2. Paksa fungsi internal init mengembalikan nilai terverifikasi (green) untuk rom porting
          find . -type f -name "init_context.c" -o -name "init.c" | xargs sed -i 's/boot_state = "orange"/boot_state = "green"/g' 2>/dev/null || true
          
          # 3. Overwrite struktur deteksi pohon perangkat (device tree) untuk Android 17
          find drivers/of/ -type f -name "*.c" | xargs sed -i 's/"orange"/"green"/g' 2>/dev/null || true
          
          echo "Injeksi manipulasi UBL sukses diterapkan!"

      # =========================================================================
      # PROSES KOMPILASI UTAMA
      # =========================================================================
      - name: Run Android Kernel Build Action
        uses: dabyd64/android-kernel-build-action@v1
        with:
          arch: 'arm64'                     
          android-version: '14'             # Menggunakan emulasi profil build 14/15 untuk penyesuaian lingkungan GKI
          compiler: 'proton-clang'          
          defconfig: 'sweet_defconfig'      
          image: 'Image.gz-dtb'            
          kernelsu: 'false'                 # Disetel false karena KSU-Next sudah dipasang manual di atas

      # =========================================================================
      # STRUKTUR PENGEPAKAN ZIP NYAMAN UNTUK VERSI ANDROID 17
      # =========================================================================
      - name: Package with AnyKernel3 (Android 17 & HyperOS Optimized)
        run: |
          git clone --depth=1 https://github.com AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          cd AnyKernel3
          # Mengonfigurasi skrip agar melewati pemeriksaan biner perangkat yang sensitif pada Android 17
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
          
          # Parameter ramdisk isolasi untuk mencegah bootloop verifikasi dinamis avb
          echo "is_slot_device=0;" >> anykernel.sh
          echo "ramdisk_compression=auto;" >> anykernel.sh
          echo "split_boot=auto;" >> anykernel.sh
          
          zip -r9 ../Kernel-HyperOS-Sweet-A17-KSUNext.zip *

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-HyperOS-Android17-Sweet
          path: Kernel-HyperOS-Sweet-A17-KSUNext.zip
